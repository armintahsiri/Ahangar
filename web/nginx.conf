# openGym — standalone web server: serves the static app AND proxies /api to the backend,
# so the app and its API share the same origin.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # security headers for every response — re-included in the regex locations below,
    # because their own add_header would otherwise suppress these
    include /etc/nginx/conf.d/security-headers.conf;

    # API → backend container
    location /api/ {
        # 6m so nginx is never tighter than the API's own 5 MB MAX_BODY (state PUTs with personal media)
        client_max_body_size 6m;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        # $http_host (not $host): the API checks the Origin host against Host, and $host
        # strips the port — direct LAN access like http://192.168.1.10:8080 would fail
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # App shell: always revalidate so updates show up immediately
    location ~* \.(js|css|json|html)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Exercise images/GIFs never change → cache hard
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|avif)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;
}
