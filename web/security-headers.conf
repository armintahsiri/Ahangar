# openGym — security headers, included at server level AND inside every location that
# declares its own add_header (an add_header in a location suppresses inherited ones).
# wake-lock and notifications stay untouched: the app needs them for workouts and pushes.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Safe-start CSP only — script-src/img-src stay out for now (inline styles, data:/blob:
# personal exercise media, and the print iframe in plan-share.js need a fuller audit).
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
# Evaluation copy (does not block anything — violations log to the browser console).
# Promote to the enforcing Content-Security-Policy header once the audit pages come back
# clean; see docs/SECURITY.md §5. frame-ancestors is a no-op here (the enforcing header
# above already carries it) but is kept so this line can replace that header verbatim.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-src 'self' about:; base-uri 'self'; object-src 'none'; form-action 'self'" always;
